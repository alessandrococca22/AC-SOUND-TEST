<style>
/* RVNNER link page — same black & white system as the AC Sound site */
:root {
  --t1: #efefef; --t2: #b9b9b9; --t3: #9b9b9b;
  --line: rgba(255,255,255,0.14);
  --font: 'Barlow', system-ui, sans-serif;
  --font-c: 'Barlow Condensed', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  min-height: 100vh; min-height: 100svh;
  background: #000; color: var(--t1);
  font-family: var(--font); font-weight: 300;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.page {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 max(22px, env(safe-area-inset-left)) calc(3rem + env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-right));
}

/* portrait fading into the black, name over its lower edge */
.hero { position: relative; margin: 0 calc(-1 * max(22px, env(safe-area-inset-left))); }
.hero img { width: 100%; height: auto; aspect-ratio: 4 / 4.4; object-fit: cover; object-position: center 22%; filter: brightness(0.8) saturate(0.82); }
.hero::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,0.7) 78%, #000 100%);
}
.id { position: relative; z-index: 1; margin-top: -5.2rem; text-align: center; }
.name { line-height: 0; }
.name img { width: min(78%, 320px); height: auto; margin: 0 auto; }
.role {
  margin-top: 0.9rem;
  font-size: 11px; font-weight: 400; letter-spacing: 0.26em; text-transform: uppercase; color: var(--t2);
}
@media (max-width: 420px) { .role { font-size: 10px; letter-spacing: 0.14em; } }
@media (max-width: 360px) {
  .role { font-size: 9.5px; letter-spacing: 0.08em; }
  .link { letter-spacing: 0.14em; padding: 0 1.1rem; }
}

.socials { display: flex; justify-content: center; gap: 0.4rem; margin-top: 1.8rem; }
.socials a {
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--t2); border-radius: 50%; transition: color 0.4s ease, background 0.4s ease;
}
.socials a:hover { color: #fff; background: rgba(255,255,255,0.06); }
.socials svg { width: 19px; height: 19px; fill: currentColor; }

.links { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2.2rem; }
.link {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  min-height: 58px; padding: 0 1.4rem;
  border: 1px solid var(--line); border-radius: 50px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #fff;
  transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
}
.link svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; transition: transform 0.4s ease; }
.link:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }
.link:hover svg { transform: translateX(4px); }
.link--solid { background: #fff; color: #000; border-color: #fff; }
.link--solid:hover { background: rgba(255,255,255,0.86); }

/* album video — YouTube only loads when someone presses play */
.section-label {
  margin: 2.8rem 0 1rem; text-align: center;
  font-family: var(--font-c); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--t3);
}
.video { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #0d0e10; }
.video button { position: absolute; inset: 0; width: 100%; border: 0; padding: 0; cursor: pointer; background: none; color: #fff; }
.video button img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); transition: filter 0.5s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
.video button:hover img { filter: brightness(0.85); transform: scale(1.02); }
.video .play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,0.92);
  display: flex; align-items: center; justify-content: center;
}
.video .play svg { width: 20px; height: 20px; fill: #000; margin-left: 3px; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-title { margin-top: 0.9rem; text-align: center; font-size: 13px; color: var(--t2); }

.back {
  display: block; margin: 3rem auto 0; width: max-content; padding: 15px 6px;
  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--t3);
  border-bottom: 1px solid transparent; transition: color 0.4s ease, border-color 0.4s ease;
}
.back:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
.foot { margin-top: 1.4rem; text-align: center; font-size: 11px; color: var(--t3); }

/* slow staged entrance */
.rise { opacity: 0; transform: translateY(14px); animation: rise 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
.hero.rise { transform: none; animation-name: fade; animation-duration: 1.6s; }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; opacity: 1; transform: none; }
  .video button img, .link svg { transition: none; }
}
@media (min-width: 700px) {
  .page { padding-top: 3rem; }
  .hero { margin: 0; border-radius: 4px; overflow: hidden; }
}
</style>
